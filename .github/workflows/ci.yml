name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These checks are independent. Running them as separate jobs makes the CI
  # critical path track the slowest check instead of the sum of all three.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Architecture audit
        # Advisory for now: 3 known pre-existing blockers. Flip to a gating step
        # (remove continue-on-error) once those are cleared.
        run: npm run architecture:audit
        continue-on-error: true

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Split out of `verify` and sharded: the suite is ~3,500 files and its cost is
  # dominated by per-file module loading, so wall time tracks file count almost
  # linearly. Four shards balanced to within 8% of each other and cut a single
  # job from 770s to 201s when measured locally at CI-like worker counts.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # job-total rather than a hard-coded 4, so adding or removing a shard in
      # the matrix above cannot silently desync the divisor and drop test files.
      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npm run test:run -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Next build
        # env.ts validates lazily, so the build compiles without secrets; the
        # Sentry sourcemap upload is skipped when SENTRY_AUTH_TOKEN is absent.
        run: npm run verify:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: "true"

  # Branch protection requires the stable `verify` context. Keep that single
  # public gate, but do not report it successful until every correctness gate
  # above has completed successfully.
  verify:
    if: always()
    needs: [lint, format, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf 'lint=%s format=%s typecheck=%s test=%s build=%s\n' \
            "$LINT_RESULT" "$FORMAT_RESULT" "$TYPECHECK_RESULT" \
            "$TEST_RESULT" "$BUILD_RESULT"

          if [[ "$LINT_RESULT" != "success" || \
                "$FORMAT_RESULT" != "success" || \
                "$TYPECHECK_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" ]]; then
            exit 1
          fi
