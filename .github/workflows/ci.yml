name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the stable `verify` check for every pull request, but avoid spending
  # the full matrix on changes that can only affect prose or changelog data.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
      tree: ${{ steps.checkout.outputs.tree }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      qualification_run: ${{ steps.reuse.outputs.qualification_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull-request checkouts are merge commits. The first parent is the
          # base revision, so depth two is enough to classify the whole change.
          fetch-depth: 2
      - name: Record the tested checkout tree
        id: checkout
        run: |
          checked_tree=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{tree}')
          test "${#checked_tree}" -eq 40
          case "$checked_tree" in *[!a-f0-9]*) exit 1 ;; esac
          printf 'tree=%s\n' "$checked_tree" >> "$GITHUB_OUTPUT"
      - name: Find reusable staging qualification
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! node scripts/ci/staging-qualification.mjs; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "promotion=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify the change
        id: scope
        shell: bash
        env:
          REUSE_QUALIFICATION: ${{ steps.reuse.outputs.reuse }}
          CAN_REUSE: ${{ (github.event_name == 'pull_request' && github.head_ref == 'staging' && github.base_ref == 'main' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.id == github.event.repository.id) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          PROMOTION: ${{ steps.reuse.outputs.promotion }}
        run: |
          if [[ "$REUSE_QUALIFICATION" == "true" && "$CAN_REUSE" == "true" ]]; then
            echo "full_suite=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REUSE_QUALIFICATION" == "true" && "$CAN_REUSE" != "true" ]]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PROMOTION" == "true" ]]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' changed_files < <(
            # Disable rename detection so both sides of a rename are classified.
            # Otherwise code renamed to a Markdown path could look content-only.
            git diff --no-renames --name-only -z --diff-filter=ACDMRT HEAD^1 HEAD
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for path in "${changed_files[@]}"; do
            if [[ "$path" =~ ^content/changelog/.*\.md$ ||
                  "$path" =~ ^docs/.*\.md$ ||
                  "$path" =~ ^[^/]+\.md$ ]]; then
              continue
            fi

            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "full_suite=false" >> "$GITHUB_OUTPUT"

  content-checks:
    needs: changes
    if: needs.changes.outputs.full_suite != 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-
      - name: Check changed files
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD \
            | xargs -0 --no-run-if-empty npx prettier --check --ignore-unknown \
                --cache --cache-strategy content \
                --cache-location .cache/prettier/.prettier-cache --
      - name: Validate changelog entries
        run: npm run changelog:check
      - name: Test changelog loading and release invariants
        run: npm run test:run -- src/lib/changelog/entryFiles.test.ts

  # These checks are independent. Running them as separate jobs makes the CI
  # critical path track the slowest check instead of the sum of all three.
  lint:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', '.eslintignore', '.eslintrc*', 'eslint.config.*', 'eslint-rules/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', '.eslintignore', '.eslintrc*', 'eslint.config.*', 'eslint-rules/**') }}-
      - name: Lint
        shell: bash
        run: |
          changed_file_list="$RUNNER_TEMP/lint-changed-files"
          git diff --no-renames --name-only -z --diff-filter=ACDMRT \
            HEAD^1 HEAD > "$changed_file_list"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             ! grep -zEq '^(\.eslintignore|\.eslintrc($|\.)|eslint\.config\.|eslint-rules/|package(-lock)?\.json$|tsconfig.*\.json$)' \
               "$changed_file_list"; then
            lint_file_list="$RUNNER_TEMP/lint-files"
            git diff --name-only -z --diff-filter=ACMRT \
              HEAD^1 HEAD > "$lint_file_list"
            mapfile -d '' lint_files < <(
              grep -zE '\.(cjs|cts|js|jsx|mjs|mts|ts|tsx)$' \
                "$lint_file_list" || true
            )
            if (( ${#lint_files[@]} > 0 )); then
              npx eslint --cache --cache-strategy content \
                --cache-location .cache/eslint/.eslintcache -- "${lint_files[@]}"
            fi
          else
            npm run lint
          fi
      - name: Build recovery and promotion qualification tests
        run: node --test scripts/ci/staging-qualification.test.mjs scripts/build-with-cache-recovery.test.mjs
      - name: Architecture audit
        run: npm run architecture:audit

  format:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-
      - name: Format check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             ! git diff --no-renames --name-only -z --diff-filter=ACDMRT HEAD^1 HEAD \
               | grep -zEq '^(\.editorconfig$|\.prettierignore$|\.prettierrc($|\.)|prettier\.config\.|package(-lock)?\.json$)'; then
            git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD \
              | xargs -0 --no-run-if-empty npx prettier --check --ignore-unknown \
                  --cache --cache-strategy content \
                  --cache-location .cache/prettier/.prettier-cache --
          else
            npm run format:check
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: typecheck-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - name: Typecheck
        run: npm run typecheck
        env:
          # The clean program can exceed 6.5 GiB during final type serialization.
          # Keep enough heap headroom for the hosted runner to finish reliably.
          NODE_OPTIONS: --max-old-space-size=12288

  # Split out of `verify` and sharded: the suite has thousands of files and its cost is
  # dominated by per-file module loading. Architecture contracts are excluded
  # here because the lint job runs the same files as a dedicated hard gate.
  test:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Use job-total rather than a fixed divisor, so adding or removing a shard in
      # the matrix above cannot silently desync the divisor and drop test files.
      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # This full-world fixture alone took 320 s in a 583 s shard. Give it
        # an independent required job so it cannot strand the other shards.
        run: npm run test:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --exclude=src/lib/admin/seed/presetBootstrap.integration.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  bootstrap-integration:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Qualify every shipping bootstrap preset
        run: npx vitest run src/lib/admin/seed/presetBootstrap.integration.test.ts --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Persist compiler work only. The full build still runs on every job;
      # runtime fetch caches and generated application outputs stay ephemeral.
      - name: Restore Turbopack compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        continue-on-error: true
        timeout-minutes: 2
        with:
          path: .next/cache/turbopack
          key: ${{ runner.os }}-${{ runner.arch }}-node22-turbopack-v1-${{ hashFiles('package-lock.json', 'package.json', 'next.config.ts', 'tsconfig*.json', 'postcss.config.*') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'public/**', 'sentry.*.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node22-turbopack-v1-${{ hashFiles('package-lock.json', 'package.json', 'next.config.ts', 'tsconfig*.json', 'postcss.config.*') }}-
      - name: Discard an incomplete compiler cache restore
        if: steps.compiler-cache.outcome == 'failure'
        run: rm -rf .next/cache/turbopack
      # The compile reaches the 16 GB runner's limit (15.7 GB on the last good
      # build, then the agent killed mid-compile on every run from 2026-10-09).
      # Swap absorbs the peak instead of losing the runner.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/build.swap
          sudo chmod 600 /mnt/build.swap
          sudo mkswap /mnt/build.swap
          sudo swapon /mnt/build.swap
          free -m
      - name: Next build
        # env.ts validates lazily, so the build compiles without secrets; the
        # Sentry sourcemap upload is skipped when SENTRY_AUTH_TOKEN is absent.
        # A background sampler logs runner memory every 10 s, so a build that
        # starves the runner shows how close it came in the job log.
        run: |
          ( while true; do echo "[mem] $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/ {printf "used=%sMB avail=%sMB ", $3, $7} /Swap:/ {printf "swap=%sMB", $3}')"; sleep 10; done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null' EXIT
          npm run verify:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: "true"
          # One static-generation worker. Three exhausted the 16 GB runner and
          # got its agent killed in about one build in five; two still did on
          # 2026-10-08 (killed at 568 of 758 pages). Static generation takes
          # about 8 s when healthy, so one worker costs little.
          NEXT_BUILD_CPUS: "1"
      - name: Report compiler cache size
        run: du -sh .next/cache/turbopack || true

  federation-transactions:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start isolated Mongo replica set
        run: |
          # Google's Docker Hub mirror: same mongo:8.0 digest, no anonymous pull limit.
          docker run --detach --name federation-mongo --publish 27991:27017 mirror.gcr.io/library/mongo:8.0 --replSet federationQualification --bind_ip_all
          # Wait until the entrypoint finishes chown before mongosh can create
          # files in /data/db. Probing earlier can make that chown fail.
          mongo_started=0
          for attempt in $(seq 1 60); do
            if docker logs federation-mongo 2>&1 | grep -q 'Waiting for connections'; then mongo_started=1; break; fi
            sleep 1
          done
          test "$mongo_started" = 1
          for attempt in $(seq 1 30); do
            if docker exec federation-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec federation-mongo mongosh --quiet --eval 'rs.initiate({_id: "federationQualification", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          federation_ready=0
          for attempt in $(seq 1 30); do
            if docker exec federation-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then federation_ready=1; break; fi
            sleep 1
          done
          test "$federation_ready" = 1
      - name: Qualify federation transactions
        run: npx vitest run src/lib/turn/federationSettlements.mongo.integration.test.ts src/lib/turn/democratic1991Bills.mongo.integration.test.ts src/lib/countries/ru/dumaElections.mongo.integration.test.ts src/lib/countries/ru/assemblySeating.mongo.integration.test.ts src/lib/countries/ru/assemblyVacancySeating.mongo.integration.test.ts src/lib/countries/ru/assemblyCampaigns.mongo.integration.test.ts src/lib/countries/ru/dumaConvocations.mongo.integration.test.ts src/lib/countries/ru/dumaElectoralProposals1995.mongo.integration.test.ts scripts/sim/experimentReportSummary.mongo.integration.test.ts src/lib/countries/ru/councilComposition.mongo.integration.test.ts src/lib/countries/bg/foundingAssembly1990.mongo.integration.test.ts src/lib/countries/bg/ordinaryAssemblySeating.mongo.integration.test.ts src/lib/countries/hu/assembly1991.mongo.integration.test.ts src/lib/countries/hu/electoralProposals1994.mongo.integration.test.ts src/lib/countries/hu/electoralProposals2011.mongo.integration.test.ts src/lib/countries/ro/electoralProposals1992.mongo.integration.test.ts src/lib/countries/bg/constitutionalProposals1991.mongo.integration.test.ts src/lib/countries/bg/constitutionalInitiative1991.mongo.integration.test.ts src/lib/countries/bg/listVacancies1991.mongo.integration.test.ts src/lib/countries/bg/constituencyByElections1991.mongo.integration.test.ts src/lib/currency/openingPolicyRates.mongo.integration.test.ts src/lib/currency/nativeGdpBasis1991.mongo.integration.test.ts src/lib/admin/seed/backfillMissingRegionLeans.mongo.integration.test.ts src/lib/charters/draftCharter.emptyStart.mongo.integration.test.ts src/lib/npp/mortality.nativeSlate.mongo.integration.test.ts src/lib/turn/bgAssemblyTransition.mongo.test.ts src/lib/admin/seed/indexes/boundedNpcCandidates.mongo.integration.test.ts src/lib/casino/casino.mongo.integration.test.ts src/app/api/discord-bot/casino/casinoRoutes.mongo.integration.test.ts src/app/api/discord-bot/tickets/intake.mongo.integration.test.ts src/lib/contests/history.mongo.integration.test.ts --maxWorkers=1
        env:
          FEDERATION_TEST_MONGO_URI: mongodb://127.0.0.1:27991/?replicaSet=federationQualification&directConnection=true
      - name: Stop isolated Mongo
        if: always()
        run: |
          docker logs federation-mongo || true
          docker rm --force federation-mongo || true

  # The operator recognizes this job only after independently checking native
  # workflow/run/job provenance and the trusted workflow and helper blobs.
  reuse-staging-qualification:
    needs: changes
    if: needs.changes.outputs.reuse == 'true' && ((github.event_name == 'pull_request' && github.head_ref == 'staging' && github.base_ref == 'main' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.id == github.event.repository.id) || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reuse the proven identical staging tree
        env:
          TREE: ${{ needs.changes.outputs.tree }}
          QUALIFICATION_RUN: ${{ needs.changes.outputs.qualification_run }}
        run: |
          [[ "$TREE" =~ ^[a-f0-9]{40}$ ]]
          [[ "$QUALIFICATION_RUN" =~ ^[0-9]+$ ]]
          printf 'Qualified tree %s in prior run %s\n' "$TREE" "$QUALIFICATION_RUN"

  # Branch protection requires the stable `verify` context. Keep that single
  # public gate, but do not report it successful until every correctness gate
  # above has completed successfully.
  verify:
    if: always()
    needs:
      [
        changes,
        content-checks,
        lint,
        format,
        typecheck,
        test,
        bootstrap-integration,
        build,
        federation-transactions,
        reuse-staging-qualification,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
          REUSE_QUALIFICATION: ${{ needs.changes.outputs.reuse }}
          CAN_REUSE: ${{ (github.event_name == 'pull_request' && github.head_ref == 'staging' && github.base_ref == 'main' && github.event.pull_request.head.repo.id == github.event.repository.id && github.event.pull_request.base.repo.id == github.event.repository.id) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          REUSE_RESULT: ${{ needs['reuse-staging-qualification'].result }}
          CONTENT_RESULT: ${{ needs.content-checks.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BOOTSTRAP_RESULT: ${{ needs['bootstrap-integration'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FEDERATION_RESULT: ${{ needs['federation-transactions'].result }}
        run: |
          printf 'changes=%s full-suite=%s content=%s\n' \
            "$CHANGES_RESULT" "$FULL_SUITE" "$CONTENT_RESULT"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$FULL_SUITE" != "true" && "$FULL_SUITE" != "false" ]]; then
            exit 1
          fi

          if [[ "$REUSE_QUALIFICATION" == "true" ]]; then
            if [[ "$CAN_REUSE" != "true" || "$FULL_SUITE" != "false" || "$REUSE_RESULT" != "success" ]]; then
              exit 1
            fi
            exit 0
          fi

          if [[ "$FULL_SUITE" == "false" ]]; then
            test "$CONTENT_RESULT" = "success"
            exit $?
          fi

          printf 'lint=%s format=%s typecheck=%s test=%s build=%s\n' \
            "$LINT_RESULT" "$FORMAT_RESULT" "$TYPECHECK_RESULT" \
            "$TEST_RESULT" "$BUILD_RESULT"
          printf 'bootstrap-integration=%s\n' "$BOOTSTRAP_RESULT"
          printf 'federation-transactions=%s\n' "$FEDERATION_RESULT"

          if [[ "$LINT_RESULT" != "success" || \
                "$FORMAT_RESULT" != "success" || \
                "$TYPECHECK_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$BOOTSTRAP_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" || \
                "$FEDERATION_RESULT" != "success" ]]; then
            exit 1
          fi
      # No checkout or application code runs here. This native successful step
      # binds full qualification to the exact checked tree without another runner.
      - name: qualified-${{ github.head_ref || github.ref_name }}-${{ github.base_ref || github.ref_name }}-tree-${{ needs.changes.outputs.tree }}
        if: needs.changes.outputs.full_suite == 'true'
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: '[[ "$TREE" =~ ^[a-f0-9]{40}$ ]]'
