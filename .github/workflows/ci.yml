name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Unit tests
        run: npm run test:run
        env:
          NODE_OPTIONS: --max-old-space-size=6144
