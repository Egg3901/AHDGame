name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Architecture audit
        # Advisory for now: 3 known pre-existing blockers. Flip to a gating step
        # (remove continue-on-error) once those are cleared.
        run: npm run architecture:audit
        continue-on-error: true
      - name: Unit tests
        run: npm run test:run
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Next build
        # env.ts validates lazily, so the build compiles without secrets; the
        # Sentry sourcemap upload is skipped when SENTRY_AUTH_TOKEN is absent.
        run: npm run verify:build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: "true"
