name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the stable `verify` check for every pull request, but avoid spending
  # the full matrix on changes that can only affect prose or changelog data.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_suite: ${{ steps.scope.outputs.full_suite }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull-request checkouts are merge commits. The first parent is the
          # base revision, so depth two is enough to classify the whole change.
          fetch-depth: 2
      - name: Classify the change
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -d '' changed_files < <(
            # Disable rename detection so both sides of a rename are classified.
            # Otherwise code renamed to a Markdown path could look content-only.
            git diff --no-renames --name-only -z --diff-filter=ACDMRT HEAD^1 HEAD
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for path in "${changed_files[@]}"; do
            if [[ "$path" =~ ^content/changelog/.*\.md$ ||
                  "$path" =~ ^docs/.*\.md$ ||
                  "$path" =~ ^[^/]+\.md$ ]]; then
              continue
            fi

            echo "full_suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          done

          echo "full_suite=false" >> "$GITHUB_OUTPUT"

  content-checks:
    needs: changes
    if: needs.changes.outputs.full_suite != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-
      - name: Check changed files
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD \
            | xargs -0 --no-run-if-empty npx prettier --check --ignore-unknown \
                --cache --cache-strategy content \
                --cache-location .cache/prettier/.prettier-cache --
      - name: Validate changelog entries
        run: npm run changelog:check
      - name: Test changelog loading and release invariants
        run: npm run test:run -- src/lib/changelog/entryFiles.test.ts

  # These checks are independent. Running them as separate jobs makes the CI
  # critical path track the slowest check instead of the sum of all three.
  lint:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', '.eslintignore', '.eslintrc*', 'eslint.config.*', 'eslint-rules/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', '.eslintignore', '.eslintrc*', 'eslint.config.*', 'eslint-rules/**') }}-
      - name: Lint
        shell: bash
        run: |
          changed_file_list="$RUNNER_TEMP/lint-changed-files"
          git diff --no-renames --name-only -z --diff-filter=ACDMRT \
            HEAD^1 HEAD > "$changed_file_list"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             ! grep -zEq '^(\.eslintignore|\.eslintrc($|\.)|eslint\.config\.|eslint-rules/|package(-lock)?\.json$|tsconfig.*\.json$)' \
               "$changed_file_list"; then
            lint_file_list="$RUNNER_TEMP/lint-files"
            git diff --name-only -z --diff-filter=ACMRT \
              HEAD^1 HEAD > "$lint_file_list"
            mapfile -d '' lint_files < <(
              grep -zE '\.(cjs|cts|js|jsx|mjs|mts|ts|tsx)$' \
                "$lint_file_list" || true
            )
            if (( ${#lint_files[@]} > 0 )); then
              npx eslint --cache --cache-strategy content \
                --cache-location .cache/eslint/.eslintcache -- "${lint_files[@]}"
            fi
          else
            npm run lint
          fi
      - name: Architecture audit
        run: npm run architecture:audit

  format:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/prettier
          key: prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-${{ github.sha }}
          restore-keys: |
            prettier-${{ runner.os }}-${{ hashFiles('package-lock.json', '.editorconfig', '.prettierignore', '.prettierrc*', 'prettier.config.*') }}-
      - name: Format check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             ! git diff --no-renames --name-only -z --diff-filter=ACDMRT HEAD^1 HEAD \
               | grep -zEq '^(\.editorconfig$|\.prettierignore$|\.prettierrc($|\.)|prettier\.config\.|package(-lock)?\.json$)'; then
            git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD \
              | xargs -0 --no-run-if-empty npx prettier --check --ignore-unknown \
                  --cache --cache-strategy content \
                  --cache-location .cache/prettier/.prettier-cache --
          else
            npm run format:check
          fi

  typecheck:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: typecheck-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - name: Typecheck
        run: npm run typecheck
        env:
          # The clean program can exceed 6.5 GiB during final type serialization.
          # Keep enough heap headroom for the hosted runner to finish reliably.
          NODE_OPTIONS: --max-old-space-size=12288

  # Split out of `verify` and sharded: the suite is ~3,500 files and its cost is
  # dominated by per-file module loading. Architecture contracts are excluded
  # here because the lint job runs the same files as a dedicated hard gate.
  test:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # job-total rather than a hard-coded 4, so adding or removing a shard in
      # the matrix above cannot silently desync the divisor and drop test files.
      - name: Unit tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npm run test:ci -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Next build
        # env.ts validates lazily, so the build compiles without secrets; the
        # Sentry sourcemap upload is skipped when SENTRY_AUTH_TOKEN is absent.
        # A background sampler logs runner memory every 10 s, so a build that
        # starves the runner shows how close it came in the job log.
        run: |
          ( while true; do echo "[mem] $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/ {print "used=" $3 "MB avail=" $7 "MB"}')"; sleep 10; done ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null' EXIT
          # Turbopack compilation can exhaust the 16 GB hosted runner.
          # Webpack build workers release each compiler before page generation.
          npm run verify:build -- --webpack
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: "true"
          # One static-generation worker. Three exhausted the 16 GB runner and
          # got its agent killed in about one build in five; two still did on
          # 2026-10-08 (killed at 568 of 758 pages). Static generation takes
          # about 8 s when healthy, so one worker costs little.
          NEXT_BUILD_CPUS: "1"

  federation-transactions:
    needs: changes
    if: needs.changes.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start isolated Mongo replica set
        run: |
          docker run --detach --name federation-mongo --publish 27991:27017 mongo:8.0 --replSet federationQualification --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec federation-mongo mongosh --quiet --eval 'quit(db.adminCommand({ping: 1}).ok ? 0 : 1)'; then break; fi
            sleep 1
          done
          docker exec federation-mongo mongosh --quiet --eval 'rs.initiate({_id: "federationQualification", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          federation_ready=0
          for attempt in $(seq 1 30); do
            if docker exec federation-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then federation_ready=1; break; fi
            sleep 1
          done
          test "$federation_ready" = 1
      - name: Qualify federation transactions
        run: npx vitest run src/lib/turn/federationSettlements.mongo.integration.test.ts src/lib/turn/democratic1991Bills.mongo.integration.test.ts src/lib/countries/ru/dumaElections.mongo.integration.test.ts src/lib/countries/ru/assemblySeating.mongo.integration.test.ts src/lib/countries/ru/assemblyVacancySeating.mongo.integration.test.ts src/lib/countries/ru/assemblyCampaigns.mongo.integration.test.ts src/lib/countries/ru/dumaConvocations.mongo.integration.test.ts src/lib/countries/ru/dumaElectoralProposals1995.mongo.integration.test.ts scripts/sim/experimentReportSummary.mongo.integration.test.ts src/lib/countries/ru/councilComposition.mongo.integration.test.ts src/lib/countries/bg/foundingAssembly1990.mongo.integration.test.ts src/lib/countries/bg/ordinaryAssemblySeating.mongo.integration.test.ts src/lib/countries/hu/assembly1991.mongo.integration.test.ts src/lib/countries/hu/electoralProposals1994.mongo.integration.test.ts src/lib/countries/hu/electoralProposals2011.mongo.integration.test.ts src/lib/countries/ro/electoralProposals1992.mongo.integration.test.ts src/lib/countries/bg/constitutionalProposals1991.mongo.integration.test.ts src/lib/countries/bg/constitutionalInitiative1991.mongo.integration.test.ts src/lib/countries/bg/listVacancies1991.mongo.integration.test.ts src/lib/countries/bg/constituencyByElections1991.mongo.integration.test.ts src/lib/currency/openingPolicyRates.mongo.integration.test.ts src/lib/currency/nativeGdpBasis1991.mongo.integration.test.ts src/lib/admin/seed/backfillMissingRegionLeans.mongo.integration.test.ts src/lib/charters/draftCharter.emptyStart.mongo.integration.test.ts src/lib/npp/mortality.nativeSlate.mongo.integration.test.ts src/lib/turn/bgAssemblyTransition.mongo.test.ts src/lib/admin/seed/indexes/boundedNpcCandidates.mongo.integration.test.ts src/lib/casino/casino.mongo.integration.test.ts src/app/api/discord-bot/casino/casinoRoutes.mongo.integration.test.ts --maxWorkers=1
        env:
          FEDERATION_TEST_MONGO_URI: mongodb://127.0.0.1:27991/?replicaSet=federationQualification&directConnection=true
      - name: Stop isolated Mongo
        if: always()
        run: |
          docker logs federation-mongo || true
          docker rm --force federation-mongo || true

  # Branch protection requires the stable `verify` context. Keep that single
  # public gate, but do not report it successful until every correctness gate
  # above has completed successfully.
  verify:
    if: always()
    needs: [changes, content-checks, lint, format, typecheck, test, build, federation-transactions]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL_SUITE: ${{ needs.changes.outputs.full_suite }}
          CONTENT_RESULT: ${{ needs.content-checks.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FEDERATION_RESULT: ${{ needs['federation-transactions'].result }}
        run: |
          printf 'changes=%s full-suite=%s content=%s\n' \
            "$CHANGES_RESULT" "$FULL_SUITE" "$CONTENT_RESULT"

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            exit 1
          fi

          if [[ "$FULL_SUITE" != "true" && "$FULL_SUITE" != "false" ]]; then
            exit 1
          fi

          if [[ "$FULL_SUITE" == "false" ]]; then
            test "$CONTENT_RESULT" = "success"
            exit $?
          fi

          printf 'lint=%s format=%s typecheck=%s test=%s build=%s\n' \
            "$LINT_RESULT" "$FORMAT_RESULT" "$TYPECHECK_RESULT" \
            "$TEST_RESULT" "$BUILD_RESULT"
          printf 'federation-transactions=%s\n' "$FEDERATION_RESULT"

          if [[ "$LINT_RESULT" != "success" || \
                "$FORMAT_RESULT" != "success" || \
                "$TYPECHECK_RESULT" != "success" || \
                "$TEST_RESULT" != "success" || \
                "$BUILD_RESULT" != "success" || \
                "$FEDERATION_RESULT" != "success" ]]; then
            exit 1
          fi
