<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="United Nations flag">
  <title>United Nations</title>
  <rect width="240" height="160" fill="#5B92E5"/>
  <g transform="translate(120 80)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <!-- Polar azimuthal projection: outer circle + concentric latitude circles -->
    <circle r="50"/>
    <circle r="38"/>
    <circle r="26"/>
    <circle r="14"/>
    <!-- Meridian lines (longitudes) -->
    <line x1="0" y1="-50" x2="0" y2="50"/>
    <line x1="-50" y1="0" x2="50" y2="0"/>
    <line x1="-35.36" y1="-35.36" x2="35.36" y2="35.36"/>
    <line x1="-35.36" y1="35.36" x2="35.36" y2="-35.36"/>
  </g>
  <!-- Olive branches encircling the globe -->
  <g transform="translate(120 80)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <path d="M-58,30 Q-72,0 -58,-30"/>
    <path d="M58,30 Q72,0 58,-30"/>
    <!-- Crossed stems at bottom -->
    <path d="M-58,30 L-8,52"/>
    <path d="M58,30 L8,52"/>
  </g>
  <!-- Olive leaves (small ellipses on each branch) -->
  <g transform="translate(120 80)" fill="#ffffff">
    <ellipse cx="-66" cy="14" rx="4" ry="2" transform="rotate(60 -66 14)"/>
    <ellipse cx="-69" cy="-2" rx="4" ry="2" transform="rotate(75 -69 -2)"/>
    <ellipse cx="-66" cy="-18" rx="4" ry="2" transform="rotate(105 -66 -18)"/>
    <ellipse cx="-58" cy="-30" rx="4" ry="2" transform="rotate(120 -58 -30)"/>
    <ellipse cx="66" cy="14" rx="4" ry="2" transform="rotate(-60 66 14)"/>
    <ellipse cx="69" cy="-2" rx="4" ry="2" transform="rotate(-75 69 -2)"/>
    <ellipse cx="66" cy="-18" rx="4" ry="2" transform="rotate(-105 66 -18)"/>
    <ellipse cx="58" cy="-30" rx="4" ry="2" transform="rotate(-120 58 -30)"/>
  </g>
</svg>
